<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulizie</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <nav class="navbar">
      <div class="logo">LOGO</div>
      <button class="cta-nav">Contattaci</button>
    </nav>

    <div class="hero-content">
      <h1>Pulizie Professionali</h1>
      <p>Servizi di qualità per la tua casa e azienda.</p>
      <div class="sphere"></div>
    </div>
  </header>

  <!-- CARD ILIAD STYLE -->
  <section class="cards">
    <div class="card">
      <span class="tag">SERVIZIO TOP</span>
      <h2>Pulizia Casa</h2>
      <p class="desc">Professionale, veloce, impeccabile.</p>
      <button class="card-btn">Prenota</button>
    </div>

    <div class="card">
      <span class="tag">AZIENDE</span>
      <h2>Uffici</h2>
      <p class="desc">Pulizia profonda e costante.</p>
      <button class="card-btn">Prenota</button>
    </div>

    <div class="card">
      <span class="tag">SPECIALI</span>
      <h2>Post Ristrutturazione</h2>
      <p class="desc">Rimozione totale di polvere e residui.</p>
      <button class="card-btn">Prenota</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
